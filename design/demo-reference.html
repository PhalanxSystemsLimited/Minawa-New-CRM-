<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Minawa Maintenance Demo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&display=swap">
<link rel="icon" href="assets/minawa-mark.png">
<style>
/* Layout: a sticky brand bar (logo, date controls, role), the sections as a turquoise pill, then the staff workspace beside a WhatsApp phone showing what the selected owner receives. Look follows the Minawa Group website: turquoise palette, Playfair Display headings, Inter text, soft white cards. */
:root{
  --bg:#f4f7f7; --surface:#ffffff; --surface-2:#eef9f8; --line:#dfe5e4; --line-strong:#c9d3d2;
  --fg:#232a30; --muted:#53606a; --accent:#0f8b8d; --accent-dark:#08686a; --accent-darkest:#075759; --accent-bright:#20aaa6; --accent-ink:#ffffff; --accent-soft:#ddf4f3;
  --good:#1b7840; --good-soft:#e2f3e7; --warn:#955800; --warn-soft:#faedd6; --bad:#b0241c; --bad-soft:#fae3e1; --info:#29599f; --info-soft:#e3ecf9;
  --wa-bg:#ebe4da; --wa-in:#ffffff; --wa-out:#d8fbd1; --wa-head:#075759; --wa-head-ink:#ffffff; --wa-meta:#667781; --wa-btn:#0a6fd6;
  --hero-from:#075759; --hero-mid:#08686a; --hero-to:#0f8b8d;
  --shadow:0 2px 12px rgba(37,42,46,.05),0 0 0 1px rgba(105,114,119,.12);
  --shadow-float:0 2px 16px rgba(37,42,46,.07),0 0 0 1px rgba(105,114,119,.18);
  --shadow-nav:0 8px 28px rgba(7,87,89,.22);
  --r-sm:10px; --r-md:16px; --r-lg:22px; --r-xl:30px;
  --f-ui:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --f-head:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-num:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light;
}
/* Always the white look of the Minawa website, even when the viewer's device is in dark mode. */
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{margin:0;font-family:var(--f-ui);font-size:14px;line-height:1.55;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent);font-weight:600;text-decoration:none}
a:hover{color:var(--accent-dark);text-decoration:underline}
::selection{background:var(--accent);color:#fff}
:focus-visible{outline:3px solid var(--accent-bright);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
h1,h2,h3,h4{margin:0;text-wrap:balance;line-height:1.25}
.muted{color:var(--muted)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--bg) 90%,transparent);-webkit-backdrop-filter:saturate(1.2) blur(10px);backdrop-filter:saturate(1.2) blur(10px);border-bottom:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.top-in{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;padding-block:12px}
@media (max-width:760px){.top{position:static}}
.brand{display:flex;align-items:center;gap:12px;margin-right:auto;min-width:0}
.logo-pill{background:#fff;border-radius:60px;padding:5px 16px;box-shadow:var(--shadow-nav);border:2px solid #ddf4f3;display:flex;align-items:center;flex:none}
.logo-pill img{height:42px;width:auto;display:block}
.b1{font-family:var(--f-head);font-weight:700;font-size:18px;line-height:1.2;color:var(--fg)}
.b2{font-size:12px;color:var(--muted)}
@media (max-width:560px){.brand>div:not(.logo-pill){display:none}}
.demo-chip{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:4px 11px;border-radius:60px;background:var(--warn-soft);color:var(--warn);white-space:nowrap}
.clock{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.today{display:flex;flex-direction:column;line-height:1.15;padding:4px 12px 4px 0;border-right:1px solid var(--line);margin-right:4px}
.today .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.16em;color:var(--accent);font-weight:700}
.today strong{font-size:15px;font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line-strong);background:var(--surface);color:var(--fg);border-radius:var(--r-sm);padding:7px 14px;font-weight:600;font-size:13px;letter-spacing:.2px;white-space:nowrap;transition:background .2s,border-color .2s,color .2s,box-shadow .2s}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{background:var(--accent-dark);border-color:var(--accent-dark);color:var(--accent-ink);box-shadow:0 6px 18px rgba(8,104,106,.22)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--line))}
.btn.danger:hover{background:var(--bad-soft);border-color:var(--bad);color:var(--bad)}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface-2);color:var(--accent)}
.btn.sm{padding:5px 12px;font-size:12.5px}
.btn[disabled],.btn[aria-disabled="true"]{opacity:.45;cursor:not-allowed;box-shadow:none}
.btn[disabled]:not(.primary):hover,.btn[aria-disabled="true"]:not(.primary):hover{border-color:var(--line-strong);color:var(--fg);background:var(--surface)}
.btn.primary[disabled]:hover,.btn.primary[aria-disabled="true"]:hover{background:var(--accent);border-color:var(--accent)}
.seg{display:inline-flex;border-radius:60px;padding:3px;background:linear-gradient(135deg,var(--accent-dark),var(--accent-darkest));box-shadow:var(--shadow-nav)}
.seg button{border:0;background:transparent;padding:5px 14px;border-radius:60px;font-weight:600;font-size:12.5px;color:rgba(255,255,255,.82)}
.seg button:hover{color:#fff;background:rgba(255,255,255,.12)}
.seg button[aria-pressed="true"]{background:#fff;color:#075759}
.next-hint{font-size:12px;color:var(--muted);max-width:190px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
@media (max-width:1340px){.next-hint{display:none}}

/* section tabs: the website's turquoise pill navigation */
.nav{padding:14px max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px))}
.nav-in{display:flex;gap:2px;width:fit-content;max-width:100%;overflow-x:auto;scrollbar-width:none;padding:5px;background:linear-gradient(135deg,var(--accent-dark),var(--accent-darkest));border:1px solid rgba(255,255,255,.16);border-radius:60px;box-shadow:var(--shadow-nav)}
.nav-in::-webkit-scrollbar{display:none}
.tab{border:0;background:transparent;padding:8px 18px;border-radius:60px;font-weight:500;font-size:13.5px;color:rgba(255,255,255,.82);white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:background .2s,color .2s}
.tab:hover{color:#fff;background:rgba(255,255,255,.12)}
.tab[aria-current="page"]{color:#fff;background:rgba(255,255,255,.18);font-weight:700}
.badge{min-width:18px;height:18px;border-radius:9px;background:#fff;color:#b0241c;font-size:11px;display:inline-grid;place-items:center;padding:0 5px;font-weight:700}

/* layout */
.layout{padding-block:24px 120px}
/* full width on large screens, with wider gutters */
@media (min-width:1200px){
  .wrap{padding-left:max(32px,env(safe-area-inset-left,0px));padding-right:max(32px,env(safe-area-inset-right,0px))}
}
main{min-width:0;display:flex;flex-direction:column;gap:18px}
.card{background:var(--surface);border-radius:var(--r-md);padding:18px 20px;min-width:0;box-shadow:var(--shadow)}
.card h3{font-family:var(--f-head);font-size:17px;font-weight:700;margin-bottom:14px;display:flex;align-items:center;gap:8px;justify-content:space-between;color:var(--fg)}
.card h3 small{font-family:var(--f-ui);font-weight:500;color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}
@media (max-width:760px){.grid2{grid-template-columns:minmax(0,1fr)}}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px}
@media (max-width:900px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}}
.kpi{position:relative;overflow:hidden;background:var(--surface);border-radius:var(--r-md);padding:16px 18px 16px 20px;display:flex;flex-direction:column;gap:4px;min-width:0;box-shadow:var(--shadow)}
.kpi::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--accent)}
.kpi .k-l{font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.kpi .k-v{font-size:24px;font-weight:700;letter-spacing:-.02em;color:var(--fg)}
.kpi .k-s{font-size:12px;color:var(--muted)}
.kpi.alert::before{background:var(--bad)}
.kpi.alert .k-l,.kpi.alert .k-v{color:var(--bad)}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;flex-wrap:wrap}
.page-head h2{font-family:var(--f-head);font-size:28px;font-weight:700;color:var(--fg)}
.page-head p{margin:4px 0 0;color:var(--muted);font-size:13.5px}
.eyebrow{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.18em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}

/* dashboard hero, after the website's turquoise hero band */
.hero{position:relative;overflow:hidden;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,clamp(280px,40%,560px));gap:28px;align-items:center;padding:30px;border-radius:var(--r-xl);background:linear-gradient(145deg,var(--hero-from) 0%,var(--hero-mid) 45%,var(--hero-to) 100%);color:#fff;box-shadow:var(--shadow-nav)}
.hero::before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at 75% 25%,rgba(92,204,201,.28) 0%,transparent 58%);pointer-events:none}
.hero>*{position:relative}
.hero .eyebrow{color:#aeeae6}
.hero h2{font-family:var(--f-head);font-size:clamp(28px,3.4vw,40px);line-height:1.15;color:#fff}
.hero h2 span{color:#aeeae6}
.hero p{margin:12px 0 0;color:rgba(255,255,255,.9);font-size:14.5px;max-width:460px}
.hero-img{border-radius:var(--r-lg);overflow:hidden;border:3px solid rgba(255,255,255,.25);box-shadow:0 20px 50px rgba(7,87,89,.38);transform:rotate(1deg);height:210px;background:rgba(255,255,255,.08)}
.hero-img img{width:100%;height:100%;object-fit:cover;display:block}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding:22px;gap:20px}.hero-img{transform:none;height:170px}}
@media (prefers-reduced-motion:no-preference){.hero-img{transition:transform .5s cubic-bezier(.25,.46,.45,.94)}.hero-img:hover{transform:rotate(0)}}

/* pills */
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:3px 10px;border-radius:60px;white-space:nowrap;background:var(--surface-2);color:var(--muted)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}
.pill.paid{background:var(--good-soft);color:var(--good)}
.pill.due{background:var(--info-soft);color:var(--info)}
.pill.overdue{background:var(--warn-soft);color:var(--warn)}
.pill.flagged{background:var(--bad-soft);color:var(--bad)}
.pill.exempt,.pill.transferred{background:var(--surface-2);color:var(--muted)}
.pill.pending{background:var(--warn-soft);color:var(--warn)}
.pill.approved{background:var(--good-soft);color:var(--good)}
.tag{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:2px 9px;border-radius:60px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.tag.bad{background:var(--bad-soft);color:var(--bad)}
.tag.warn{background:var(--warn-soft);color:var(--warn)}
.tag.good{background:var(--good-soft);color:var(--good)}
.tag.info{background:var(--info-soft);color:var(--info)}

/* tables */
.tbl-wrap{overflow-x:auto;margin:0 -20px;padding:0 20px}
table{width:100%;border-collapse:collapse;font-size:13px}
th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.12em;color:var(--muted);font-weight:700;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:10px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.r,th.r{text-align:right}
tbody tr.click{cursor:pointer}
tbody tr.click:hover td{background:var(--surface-2)}
.cell-main{font-weight:600}
.cell-sub{font-size:12px;color:var(--muted)}
.neg{color:var(--good)}
.chg{color:var(--fg)}

/* filters */
.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chipbtn{border:1px solid var(--line-strong);background:var(--surface);border-radius:60px;padding:5px 13px;font-size:12.5px;font-weight:600;color:var(--muted);display:inline-flex;gap:6px;align-items:center;transition:background .2s,border-color .2s,color .2s}
.chipbtn:hover{border-color:var(--accent);color:var(--accent)}
.chipbtn[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.chipbtn .n{font-family:var(--f-num);font-variant-numeric:tabular-nums;font-size:11.5px;opacity:.8}
.search{flex:1 1 200px;min-width:0;border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 12px;background:var(--surface)}
.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 18%,transparent)}

/* charts */
.chart svg{width:100%;max-width:520px;height:auto;display:block}
.chart text{font-family:var(--f-ui);font-size:11px;fill:var(--muted)}
.chart .v{font-family:var(--f-num);font-variant-numeric:tabular-nums;fill:var(--fg);font-size:11px;font-weight:600}

/* profile */
.prof-head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start}
@media (max-width:640px){.prof-head{grid-template-columns:minmax(0,1fr)}}
.prof-head h2{font-family:var(--f-head);font-size:28px;font-weight:700}
.meta-row{display:flex;flex-wrap:wrap;gap:6px 14px;color:var(--muted);font-size:13px;margin-top:6px}
.bal{text-align:right;background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 22%,transparent);border-radius:var(--r-md);padding:12px 18px;min-width:180px}
@media (max-width:640px){.bal{text-align:left}}
.bal .l{font-size:10.5px;color:var(--accent);font-weight:700;letter-spacing:.14em;text-transform:uppercase}
.bal .v{font-size:26px;font-weight:700;letter-spacing:-.02em}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.back{border:0;background:transparent;color:var(--accent);font-weight:600;padding:0;display:inline-flex;gap:6px;align-items:center}
.back:hover{color:var(--accent-dark)}
.notes{display:flex;flex-direction:column;gap:10px}
.note{border-left:3px solid var(--accent);padding:2px 0 2px 12px}
.note .by{font-size:12px;color:var(--muted)}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)}
.li:last-child{border-bottom:0}
.li .t{min-width:0}
.li .t .a{font-weight:600}
.li .t .b{font-size:12px;color:var(--muted)}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
.callout{display:flex;gap:10px;align-items:flex-start;padding:11px 14px;border-radius:12px;background:var(--surface-2);font-size:13px}
.callout.warn{background:var(--warn-soft)}
.callout.bad{background:var(--bad-soft)}
.callout.good{background:var(--good-soft)}
.rules{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;font-size:13px}

/* settings */
.form-row{display:flex;flex-direction:column;gap:5px}
.form-row label{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
input[type=text],input[type=number],input[type=date],input[type=tel],select,textarea{border:1px solid var(--line-strong);border-radius:var(--r-sm);padding:8px 11px;background:var(--surface);width:100%;min-width:0}
textarea{resize:vertical;min-height:84px;line-height:1.45}
.tpl{display:flex;flex-direction:column;gap:8px;padding:14px 0;border-bottom:1px solid var(--line)}
.tpl:last-child{border-bottom:0}
.tpl-h{display:flex;justify-content:space-between;align-items:center;gap:8px}
.ph{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:11.5px;color:var(--muted)}
.fee-in{width:110px;text-align:right}


/* modal */
[hidden]{display:none !important}
#modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;padding:16px}
.m-back{position:absolute;inset:0;background:rgba(5,38,39,.55);-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.m-card{position:relative;background:var(--surface);border-radius:var(--r-lg);box-shadow:0 24px 70px rgba(5,38,39,.35);width:min(480px,100%);max-height:calc(100vh - 32px);overflow:auto}
.m-card.wide{width:min(640px,100%)}
.m-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface);z-index:1}
.m-head h3{font-family:var(--f-head);font-size:19px;font-weight:700}
.icon{border:0;background:transparent;font-size:22px;line-height:1;width:34px;height:34px;border-radius:60px;color:var(--muted)}
.icon:hover{background:var(--surface-2);color:var(--accent)}
.m-body{padding:18px 20px;display:flex;flex-direction:column;gap:12px}
.m-actions{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
/* checkout */
.co{display:flex;flex-direction:column;gap:12px}
.co-top{display:flex;justify-content:space-between;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.co-lock{display:inline-flex;gap:6px;align-items:center;font-weight:600;color:var(--good)}
.bd{border:1px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface)}
.bd-who{font-size:14px;margin-bottom:6px}
.bd-t{font-size:13.5px}
.bd-t td{padding:7px 0;border-bottom:1px dashed var(--line)}
.bd-sub td{font-weight:600;border-bottom-style:solid}
.bd-tot td{font-weight:700;font-size:17px;border-bottom:0;padding-top:10px;color:var(--accent-darkest)}
.co-amt{font-size:32px;font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.methods{display:flex;flex-direction:column;gap:8px;border:0;padding:0;margin:0}
.method{display:flex;align-items:center;gap:10px;border:1px solid var(--line-strong);border-radius:12px;padding:11px 14px;cursor:pointer;transition:border-color .2s,background .2s}
.method:hover{border-color:var(--accent)}
.method:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.method input{accent-color:var(--accent)}
.method .mt{font-weight:600}
.method .ms{font-size:12px;color:var(--muted)}
.co-hint{font-size:12.5px;color:var(--muted);background:var(--surface-2);border-radius:10px;padding:9px 12px}
/* document preview (always on white paper) */
.doc{background:#fff;color:#232a30;border:1px solid #dfe5e4;border-radius:10px;padding:24px;font-size:12.5px;display:flex;flex-direction:column;gap:14px;box-shadow:0 2px 12px rgba(37,42,46,.06)}
.doc .dh{display:flex;justify-content:space-between;align-items:center;gap:12px;border-bottom:2px solid #0f8b8d;padding-bottom:12px}
.doc .doc-logo{height:54px;width:auto;display:block}
.doc .dh .org{font-family:"Playfair Display",Georgia,serif;font-weight:700;font-size:17px;color:#075759}
.doc .dh .sub{color:#53606a;font-size:11.5px}
.doc table{font-size:12.5px}
.doc th{color:#53606a;border-color:#dfe5e4}
.doc td{border-color:#eef2f2}
.doc .tot td{font-weight:700;border-top:2px solid #075759}
.doc .kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 18px}
.doc .kv div span{display:block;color:#697277;font-size:11px}
.doc .fine{background:#fff4e0;border-radius:8px;padding:9px 11px;color:#6b4200}
.doc .stamp{border:2px solid #0f8b8d;color:#075759;border-radius:10px;padding:10px;text-align:center;font-weight:700;letter-spacing:.06em}
.doc .demo{color:#a06000;font-size:11px}
.doc td .sub{color:#697277;font-size:11px}

/* drawer */
#drawer{position:fixed;inset:0;z-index:40}
.d-back{position:absolute;inset:0;background:rgba(5,38,39,.4)}
.d-panel{position:absolute;top:0;right:0;bottom:0;width:min(460px,100%);background:var(--surface);box-shadow:-12px 0 44px rgba(5,38,39,.25);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);padding-right:env(safe-area-inset-right,0px)}
.d-head{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);gap:8px}
.d-head h3{font-family:var(--f-head);font-size:19px;font-weight:700}
.d-body{overflow-y:auto;padding:8px 20px 24px;flex:1}
.ev{display:grid;grid-template-columns:44px minmax(0,1fr);gap:4px 10px;padding:9px 0;border-bottom:1px solid var(--line);font-size:13px}
.ev .tm{font-variant-numeric:tabular-nums;font-size:11.5px;color:var(--muted);padding-top:2px}
.ev .k{font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin-right:6px}
.k.webhook,.k.payment{color:var(--good)}
.k.link{color:var(--info)}
.k.fine,.k.flag,.k.alert{color:var(--bad)}
.k.job{color:var(--accent)}
.k.message,.k.bill{color:var(--muted)}
.k.admin{color:var(--warn)}
.ev-day{font-size:10.5px;font-weight:700;color:var(--accent);text-transform:uppercase;letter-spacing:.14em;padding:16px 0 4px}

/* simple pieces: header layout, demo bar, More menu, profile tabs, lists you can click */
.top-in{justify-content:space-between}
.brand{margin-right:0}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){.kpis.three{grid-template-columns:minmax(0,1fr)}}
.hero-btn{margin-top:18px;background:#fff;border-color:#fff;color:#075759}
.hero-btn:hover{background:#ddf4f3;border-color:#ddf4f3;color:#075759}
.li.click{cursor:pointer;border-radius:12px;padding:12px 10px;margin:0 -10px;border-bottom-color:transparent}
.li.click+.li.click{border-top:1px solid var(--line)}
.li.click:hover{background:var(--surface-2)}
.li .amt{display:flex;align-items:center;gap:10px;flex:none}
.li .amt strong{font-size:14px}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tags:empty{display:none}
.more{position:relative}
.more>summary{list-style:none}
.more>summary::-webkit-details-marker{display:none}
.menu{position:absolute;z-index:15;top:calc(100% + 6px);left:0;min-width:220px;background:var(--surface);border-radius:14px;padding:6px;box-shadow:0 16px 40px rgba(5,38,39,.18),0 0 0 1px rgba(105,114,119,.14);display:flex;flex-direction:column}
.menu button{border:0;background:transparent;text-align:left;padding:9px 12px;border-radius:9px;font-weight:500;font-size:13.5px;color:var(--fg)}
.menu button:hover{background:var(--surface-2);color:var(--accent)}
.menu button[disabled],.menu button[aria-disabled="true"]{opacity:.45;cursor:not-allowed}
.menu button.danger{color:var(--bad)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 6px}
.ptabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:-4px 0 14px;overflow-x:auto;scrollbar-width:none}
.ptabs button{border:0;background:transparent;padding:10px 14px;font-weight:600;font-size:13.5px;color:var(--muted);border-bottom:2px solid transparent;margin-bottom:-1px;white-space:nowrap}
.ptabs button:hover{color:var(--accent)}
.ptabs button[aria-current="true"]{color:var(--accent);border-bottom-color:var(--accent)}
.allclear{text-align:center;padding:40px 16px}
.allclear .big{font-family:var(--f-head);font-size:24px;font-weight:700;margin:8px 0 4px}
.rules-card>summary{cursor:pointer;list-style:none;font-family:var(--f-head);font-size:17px;font-weight:700}
.rules-card>summary::-webkit-details-marker{display:none}
.rules-card>summary::after{content:" +";color:var(--accent)}
.rules-card[open]>summary::after{content:" −"}
.rules-card[open]>summary{margin-bottom:12px}

/* payments: avatars, method dots, the method split bar, table totals */
.av{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent-darkest);display:grid;place-items:center;font-weight:700;font-size:12.5px;flex:none}
.pay-li{justify-content:flex-start;gap:12px}
.pay-li .t{flex:1}
.pay-li .when{text-align:right;font-size:12px;color:var(--muted);white-space:nowrap;display:flex;flex-direction:column;gap:2px}
.fam{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.fam::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--c);flex:none}
.sub-h{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);margin:18px 0 6px}
.split{display:flex;height:12px;border-radius:60px;overflow:hidden;background:var(--surface-2);margin-bottom:12px}
.split span{display:block;height:100%}
.legend{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px 18px;font-size:12.5px}
.legend div{display:flex;justify-content:space-between;gap:8px;min-width:0}
@media (max-width:640px){.legend{grid-template-columns:minmax(0,1fr)}}
tfoot td{border-top:2px solid var(--line);border-bottom:0;padding-top:12px}

/* demo-only controls, kept apart from the product in a dark floating bar */
.demobar{position:fixed;z-index:35;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;align-items:center;gap:6px;max-width:calc(100% - 24px);overflow-x:auto;scrollbar-width:none;background:#252a2e;color:#fff;border-radius:60px;padding:6px 8px 6px 14px;box-shadow:0 14px 40px rgba(0,0,0,.28);white-space:nowrap}
.demobar::-webkit-scrollbar{display:none}
.db-tag{font-size:10px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#f5c06b}
.db-sp{font-size:11px;font-weight:700;color:#5cccc9;border:1px solid rgba(92,204,201,.45);border-radius:60px;padding:3px 9px}
.db-date{font-size:13px;font-weight:600;padding:0 6px}
.db-date small{display:block;font-size:9.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:#aeeae6;line-height:1}
.db-btn{border:1px solid rgba(255,255,255,.22);background:transparent;color:#fff;border-radius:60px;padding:6px 12px;font-weight:600;font-size:12.5px}
.db-btn:hover{background:rgba(255,255,255,.1)}
.db-btn.primary{background:#20aaa6;border-color:#20aaa6;color:#04201f}
.db-btn.primary:hover{background:#5cccc9;border-color:#5cccc9}
.db-btn[disabled]{opacity:.45;cursor:not-allowed}
.db-hint{font-size:12px;color:rgba(255,255,255,.7);max-width:200px;overflow:hidden;text-overflow:ellipsis;padding:0 4px}
@media (max-width:1100px){.db-hint{display:none}}
.db-sep{width:1px;height:22px;background:rgba(255,255,255,.18);margin:0 4px;flex:none}
.demobar .seg{box-shadow:none;background:rgba(255,255,255,.1)}
.demobar .seg button{padding:5px 11px}

/* toast */
#toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;display:flex;flex-direction:column;gap:8px;align-items:center;pointer-events:none;width:calc(100% - 32px);max-width:480px}
.toast{background:#075759;color:#fff;padding:11px 18px;border-radius:60px;font-size:13px;font-weight:500;box-shadow:var(--shadow-nav);animation:tin .2s ease-out}
@keyframes tin{from{transform:translateY(8px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){.toast{animation:none}.btn,.tab,.chipbtn{transition:none}}
.foot-note{font-size:12px;color:var(--muted);text-align:center;padding-block:0 28px}

/* ===== Black, white and neon green, in a sidebar admin layout =====
   Black is the main colour, white the second, neon green the accent for buttons and highlights.
   Neon is never used as text on white (too faint); green text on white uses --neon-deep. */
:root{
  --ink:#0b0b0c; --neon:#39ff14; --neon-soft:#ecffe4; --neon-deep:#1d7a12;
  --bg:#f3f4f1; --surface:#ffffff; --surface-2:#f5f6f2; --line:#e5e7e1; --line-strong:#d0d3cb;
  --fg:#0b0b0c; --muted:#5d6159;
  --accent:#0b0b0c; --accent-dark:#000000; --accent-darkest:#000000; --accent-bright:#39ff14; --accent-ink:#ffffff; --accent-soft:#ecffe4;
  --hero-from:#0b0b0c; --hero-mid:#101210; --hero-to:#151a14;
  --wa-head:#008069;
  --shadow:0 1px 2px rgba(0,0,0,.04),0 0 0 1px rgba(0,0,0,.06);
  --shadow-nav:0 12px 32px rgba(0,0,0,.16);
  --f-head:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
::selection{background:var(--neon);color:var(--ink)}
:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--neon);text-decoration-thickness:2px;text-underline-offset:3px}
a:hover{color:var(--ink);text-decoration-color:var(--ink)}
.ico{display:block;flex:none}

/* frame: black sidebar + white top bar */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--ink);color:#fff;display:flex;flex-direction:column;padding:18px 14px;gap:4px;scrollbar-width:thin;z-index:30}
.side :focus-visible{outline-color:var(--neon)}
.side-brand{display:flex;align-items:center;gap:11px;padding:4px 6px 18px;border-bottom:1px solid rgba(255,255,255,.08);margin-bottom:6px}
.side-logo{width:40px;height:40px;border-radius:11px;background:#fff;display:grid;place-items:center;overflow:hidden;flex:none}
.side-logo img{width:32px;height:32px;display:block}
.sb1{font-weight:800;font-size:15px;letter-spacing:-.01em}
.sb2{font-size:11.5px;color:rgba(255,255,255,.55)}
.side-h{font-size:10.5px;font-weight:700;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.38);padding:16px 10px 6px}
.side-i{display:flex;align-items:center;gap:11px;width:100%;border:0;background:transparent;color:rgba(255,255,255,.72);padding:10px 12px;border-radius:11px;font-weight:500;font-size:14px;text-align:left;transition:background .15s,color .15s}
.side-i:hover{background:rgba(255,255,255,.07);color:#fff}
.side-i[aria-current="page"]{background:var(--neon);color:var(--ink);font-weight:700}
.side-l{flex:1}
.side-b{min-width:20px;height:20px;border-radius:10px;background:var(--neon);color:var(--ink);font-size:11px;font-weight:800;display:inline-grid;place-items:center;padding:0 6px}
.side-i[aria-current="page"] .side-b{background:var(--ink);color:var(--neon)}
.side-foot{margin-top:auto;font-size:11.5px;color:rgba(255,255,255,.38);padding:14px 10px 4px;border-top:1px solid rgba(255,255,255,.08)}
.side-scrim{display:none}
.shell{min-width:0;display:flex;flex-direction:column}
.top{position:sticky;top:0;z-index:20;background:rgba(255,255,255,.94);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.top-in{display:flex;flex-wrap:nowrap;align-items:center;justify-content:flex-start;gap:10px;padding:12px 28px}
.gsearch{display:flex;align-items:center;gap:8px;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:0 12px;height:40px;flex:0 1 380px;min-width:0;color:var(--muted)}
.gsearch input{border:0;background:transparent;outline:none;flex:1;min-width:0;height:100%;padding:0;color:var(--ink)}
.gsearch:focus-within{border-color:var(--ink);background:#fff}
.top-sp{flex:1}
.icon-btn{position:relative;width:40px;height:40px;border-radius:12px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--ink);flex:none}
.icon-btn:hover{border-color:var(--ink)}
.dot-n{position:absolute;top:-6px;right:-6px;min-width:19px;height:19px;border-radius:10px;background:var(--neon);color:var(--ink);font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 5px;border:2px solid #fff}
.me{display:flex;align-items:center;gap:9px;padding:4px 12px 4px 4px;border:1px solid var(--line);border-radius:14px;flex:none}
.me-av{width:32px;height:32px;border-radius:10px;background:var(--ink);color:var(--neon);display:grid;place-items:center;font-weight:800;font-size:11.5px;letter-spacing:.04em}
.me-n{font-weight:700;font-size:13px;line-height:1.15}
.me-r{font-size:11px;color:var(--muted)}
.only-m{display:none}
.qa>summary.btn{height:40px;border-radius:12px;gap:7px}
.menu-r{left:auto;right:0}
.layout.wrap{padding-left:28px;padding-right:28px}
.crumbs{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:-4px}
.crumbs h1{font-size:13px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;margin:0}
.crumb-path{font-size:13px;color:var(--muted)}
.crumb-path span{margin:0 7px;color:var(--line-strong)}
main .page-head h2{display:none}
@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;width:272px;height:auto;transform:translateX(-102%);transition:transform .22s ease;box-shadow:0 0 60px rgba(0,0,0,.4)}
  body.side-open .side{transform:none}
  body.side-open .side-scrim{display:block;position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:29}
  .only-m{display:grid}
  .me-t,.qa .lbl{display:none}
  .top-in{padding:10px 14px;gap:8px}
  .layout.wrap{padding-left:14px;padding-right:14px}
}
@media (max-width:560px){.me{display:none}.gsearch{flex:1 1 auto}}
@media (prefers-reduced-motion:reduce){.side{transition:none}}

/* buttons: black main, white secondary, neon for highlight actions */
.btn{background:#fff;border-color:var(--line-strong);color:var(--ink);border-radius:10px}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.primary{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.primary:hover{background:#000;border-color:#000;color:var(--neon);box-shadow:none}
.btn.neon{background:var(--neon);border-color:var(--neon);color:var(--ink)}
.btn.neon:hover{background:#2be60a;border-color:#2be60a;color:var(--ink)}
.btn.ghost:hover{background:var(--surface-2);color:var(--ink)}
.chipbtn:hover{border-color:var(--ink);color:var(--ink)}
.chipbtn[aria-pressed="true"]{background:var(--ink);color:#fff;border-color:var(--ink)}
.chipbtn[aria-pressed="true"] .n{color:var(--neon);opacity:1}
.seg button[aria-pressed="true"]{background:var(--neon);color:var(--ink)}
.ptabs button:hover{color:var(--ink)}
.ptabs button[aria-current="true"]{color:var(--ink);border-bottom-color:var(--neon);border-bottom-width:3px}
.menu button:hover{color:var(--ink)}
.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(57,255,20,.35)}
.method:has(input:checked){border-color:var(--ink);background:var(--neon-soft)}
.method input{accent-color:var(--ink)}
.back{color:var(--ink)}
.toast{background:var(--ink);color:#fff;border:1px solid rgba(57,255,20,.5)}
.note{border-left-color:var(--neon)}

/* cards and headings in a cleaner sans */
.card{border-radius:18px;padding:20px}
.card h3{font-family:var(--f-ui);font-size:16px;font-weight:700;letter-spacing:-.01em}
.prof-head h2{font-family:var(--f-ui);font-weight:800;letter-spacing:-.02em}
.eyebrow{color:var(--ink)}
.bal .l{color:var(--neon-deep)}
.av{background:var(--ink);color:var(--neon)}
.bd-tot td{color:var(--ink)}
.chart .v{fill:var(--ink)}
.k.job{color:var(--neon-deep)}
.ev-day{color:var(--ink)}

/* demo bar */
.db-btn.primary{background:var(--neon);border-color:var(--neon);color:var(--ink)}
.db-btn.primary:hover{background:#2be60a;border-color:#2be60a}
.db-sp{color:var(--neon);border-color:rgba(57,255,20,.45)}
.db-date small{color:var(--neon)}
.demobar{background:#000;border:1px solid rgba(255,255,255,.12)}
@media (min-width:901px){.demobar{left:calc(50% + 126px);max-width:calc(100% - 300px)}}

/* PDF documents: black on white */
.doc .dh{border-bottom-color:#0b0b0c}
.doc .dh .org{color:#0b0b0c}
.doc .tot td{border-top-color:#0b0b0c}
.doc .stamp{border-color:#0b0b0c;color:#0b0b0c;background:#ecffe4}

/* dashboard: black welcome banner */
.hero{grid-template-columns:minmax(0,1fr) auto;align-items:start;padding:28px 30px;border-radius:22px;box-shadow:none;background:radial-gradient(ellipse at 88% -10%,rgba(57,255,20,.22),transparent 55%),linear-gradient(145deg,#0b0b0c,#141814)}
.hero::before{display:none}
.hero h2{font-family:var(--f-ui);font-size:clamp(26px,3vw,34px);font-weight:800;letter-spacing:-.025em}
.hero h2 span{color:var(--neon)}
.hero p{max-width:620px}
.hero p b{color:#fff}
.hero-chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}
.hchip{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;padding:5px 11px;border-radius:60px;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);color:#fff;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hchip .live{width:7px;height:7px;border-radius:50%;background:var(--neon);box-shadow:0 0 0 3px rgba(57,255,20,.25);flex:none}
.hero-stats{display:flex;flex-wrap:wrap;row-gap:12px;margin-top:22px}
.hs{padding-right:24px;margin-right:24px;border-right:1px solid rgba(255,255,255,.14)}
.hs:last-child{border-right:0;margin-right:0;padding-right:0}
.hs .l{font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.hs .v{font-size:23px;font-weight:800;margin-top:4px;color:#fff}
.hs .v.neon{color:var(--neon)}
.hero-side{display:flex;flex-direction:column;align-items:flex-end;gap:12px}
.hero-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.hero .btn{height:40px;border-radius:11px}
.hero .btn.ghost-d{background:rgba(255,255,255,.08);border-color:rgba(255,255,255,.2);color:#fff}
.hero .btn.ghost-d:hover{background:rgba(255,255,255,.14);color:var(--neon)}
.hero-date{font-size:12.5px;color:rgba(255,255,255,.6)}
@media (max-width:760px){.hero{grid-template-columns:minmax(0,1fr);padding:22px}.hero-side{align-items:flex-start}.hero-btns{justify-content:flex-start}.hs{padding-right:16px;margin-right:16px}}

/* dashboard: stat cards, health card, tiles */
.dgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:18px}
.dgrid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.dgrid .span2{grid-column:span 2}
@media (max-width:1240px){.dgrid,.dgrid.three{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:640px){.dgrid,.dgrid.three{grid-template-columns:minmax(0,1fr)}.dgrid .span2{grid-column:auto}}
.stat{background:var(--surface);border-radius:18px;padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:4px;min-width:0}
.stat-top{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px;gap:8px}
.stat-ic{width:42px;height:42px;border-radius:12px;background:var(--ink);color:var(--neon);display:grid;place-items:center;flex:none}
.stat-ic.sm{width:34px;height:34px;border-radius:10px}
.stat-l{font-size:13px;color:var(--muted);font-weight:500}
.stat-v{font-size:28px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.chip-t{display:inline-flex;align-items:center;gap:4px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:8px;white-space:nowrap}
.chip-t.up{background:var(--neon-soft);color:var(--neon-deep)}
.chip-t.down{background:var(--bad-soft);color:var(--bad)}
.chip-t.flat{background:var(--surface-2);color:var(--muted)}
.spark{width:100%;height:48px;display:block;margin:8px 0 2px}
.stat-rows{display:flex;flex-direction:column;gap:7px;margin-top:auto;padding-top:10px;font-size:12.5px}
.stat-rows div{display:flex;justify-content:space-between;gap:8px;color:var(--muted)}
.stat-rows b{color:var(--ink);font-weight:600}
.prog{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden;margin:12px 0 6px}
.prog span{display:block;height:100%;border-radius:8px;background:var(--ink)}
.prog span.neon{background:var(--neon)}
.mbars{display:flex;align-items:flex-end;gap:8px;height:52px;margin:8px 0 2px}
.mb{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end}
.mb span{display:block;width:100%;border-radius:6px 6px 2px 2px;background:var(--ink)}
.mb span.now{background:var(--neon)}
.card-row{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:14px}
.card-row h3{margin:0}
.card-h{display:flex;align-items:center;gap:11px;margin-bottom:12px}
.card-h h3{margin:0}
.health p{margin:0;color:var(--muted);line-height:1.65;font-size:13.5px}
.health p b{color:var(--ink)}
.htiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;margin-top:16px}
@media (max-width:640px){.htiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.ht{background:var(--surface-2);border-radius:12px;padding:12px 14px}
.ht .l{font-size:12px;color:var(--muted)}
.ht .v{font-size:19px;font-weight:800;margin-top:4px;letter-spacing:-.01em}
.dsplit{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:18px}
@media (max-width:1100px){.dsplit{grid-template-columns:minmax(0,1fr)}}
.mtiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.mt{background:var(--surface-2);border-radius:14px;padding:14px}
.mt .stat-ic{margin-bottom:12px}
.mt .l{font-size:12.5px;color:var(--muted)}
.mt .v{font-size:21px;font-weight:800;letter-spacing:-.01em;margin-top:2px}
.mt .s{font-size:12px;color:var(--muted);margin-top:2px}
.who{display:flex;align-items:center;gap:11px}
.rcpt{display:inline-flex;font-size:12px;font-weight:700;padding:4px 10px;border-radius:8px;background:var(--neon-soft);color:var(--neon-deep);text-decoration:none;white-space:nowrap}
.rcpt:hover{background:var(--neon);color:var(--ink)}
/* Receipts and "Safepay received" */
.sp-ok{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:8px;background:var(--neon-soft);color:var(--neon-deep);white-space:nowrap}
.sp-ok svg{flex:none}
.recv-by{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px 3px 7px;border-radius:8px;background:var(--surface-2);color:var(--ink);white-space:nowrap}
.doc .rstamp{display:flex;gap:12px;align-items:center;border:2px solid #0b0b0c;border-radius:12px;padding:12px 14px;background:#f6f6f4;-webkit-print-color-adjust:exact;print-color-adjust:exact}
.doc .rstamp.sp{background:#ecffe4;border-color:#1d7a12}
.doc .rs-ic{width:34px;height:34px;border-radius:50%;background:#0b0b0c;color:#39ff14;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}
.doc .rs-t{min-width:0}
.doc .rs-t b{display:block;font-size:14px;color:#0b0b0c}
.doc .rs-t span{display:block;color:#4a524c;font-size:12px;margin-top:2px}
.doc .rs-amt{margin-left:auto;font-weight:800;font-size:19px;color:#0b0b0c;white-space:nowrap}
.doc .kv div{min-width:0;overflow-wrap:anywhere}
.doc .rfoot{color:#4a524c;font-size:11.5px}
.rc-flash{margin-bottom:14px}
.stat-foot{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.stat-go{width:100%;justify-content:space-between}
.stat-go:hover{background:var(--ink);border-color:var(--ink);color:var(--neon)}
.health .stat-foot{margin-top:16px}
.li .go{flex:none}
/* Monthly target */
.target{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:22px;align-items:stretch}
@media (max-width:1100px){.target{grid-template-columns:minmax(0,1fr)}}
.tg-top{display:flex;align-items:flex-start;gap:14px}
.tg-h{flex:1;min-width:0}
.tg-v{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.15;color:var(--ink)}
.tg-bar{position:relative;height:14px;border-radius:10px;background:var(--surface-2);margin:18px 0 14px;overflow:hidden}
.tg-bar span{display:block;height:100%;border-radius:10px;background:var(--neon);min-width:4px}
.tg-bar i{position:absolute;top:0;bottom:0;width:2px;background:var(--ink);opacity:.55}
.tg-nums{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
@media (max-width:560px){.tg-nums{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tg-nums div{background:var(--surface-2);border-radius:12px;padding:10px 12px;min-width:0}
.tg-nums span{display:block;font-size:12px;color:var(--muted)}
.tg-nums b{display:block;font-size:16px;font-weight:800;margin-top:2px;color:var(--ink);overflow-wrap:anywhere}
.tg-side{display:flex;flex-direction:column;min-width:0}
.tg-types{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tt{border:1px solid var(--line);border-radius:12px;padding:11px 13px;min-width:0}
.tt .l{font-size:12px;color:var(--muted);font-weight:600}
.tt .v{font-size:15px;font-weight:800;margin-top:3px;color:var(--ink)}
.tt .s{font-size:12px;color:var(--neon-deep);font-weight:700;margin-top:1px}
.tg-side .stat-foot{margin-top:auto;padding-top:12px}
.legend{display:flex;gap:16px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.lg-bar{width:12px;height:12px;border-radius:3px;background:var(--ink)}
.lg-tgt{width:16px;height:0;border-top:2.5px dashed var(--neon-deep)}
.tg-tbl .tot td{font-weight:800;border-top:2px solid var(--ink)}
.tg-h4{margin:18px 0 10px;font-size:14px}
/* Live WhatsApp (sent by hand) */
.btn.wa{background:#25d366;border-color:#25d366;color:#fff;text-decoration:none}
.btn.wa:hover{background:#1da851;border-color:#1da851;color:#fff}
.btn.wa[aria-disabled="true"]{opacity:.5;cursor:not-allowed}
.wa-ico{width:17px;height:17px;flex:none}
.wa-ico.inl{width:14px;height:14px;vertical-align:-2px;color:#1da851}
.wa-mini{width:30px;height:30px;border-radius:50%;border:0;background:#25d366;color:#fff;display:grid;place-items:center;flex:none;padding:0}
.wa-mini:hover{background:#1da851}
.wa-mini .wa-ico{width:16px;height:16px}
.wa-to{display:flex;gap:12px;align-items:center;background:var(--surface-2);border-radius:12px;padding:12px 14px;margin-bottom:12px}
.wa-to .wa-logo{width:40px;height:40px;border-radius:50%;background:#25d366;color:#fff;display:grid;place-items:center;flex:none}
.wa-to .wa-logo .wa-ico{width:22px;height:22px}
#waText{font-family:inherit;font-size:13px;line-height:1.45;min-height:250px;resize:vertical}
.wa-att{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-top:10px}
.wa-att .pdf-ic{width:30px;height:36px;border-radius:4px;background:#e24a3b;color:#fff;font-size:9px;font-weight:800;display:grid;place-items:center;flex:none}
.wa-att .t{flex:1 1 180px;min-width:0}
.wa-att .t b{display:block;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wa-ways{display:flex;flex-direction:column;gap:8px}
.wa-way{display:flex;align-items:center;gap:12px;flex-wrap:wrap;border:1px solid var(--line);border-radius:12px;padding:11px 13px}
.wa-way .t{flex:1 1 240px;min-width:0}
.wa-way .t b{display:block;font-size:13.5px}
.wa-way .t .cell-sub{display:block}
.wa-way.off{background:var(--surface-2);border-style:dashed}
.wa-way .btn{flex:none}
.bad-t{color:var(--bad);font-weight:600}
.wa-steps{margin:8px 0 0;padding-left:20px;font-size:13px;line-height:1.6}
.wa-steps code{font-size:12px;background:var(--surface-2);padding:1px 5px;border-radius:5px}
.wa-prev{margin-top:8px}
.wa-prev summary{cursor:pointer;font-size:12.5px;font-weight:700}
.wa-prev .doc{margin-top:10px}
.wa-test{display:flex;gap:8px;flex-wrap:wrap}
.wa-test input{flex:1 1 200px;width:auto}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.tg-opts{display:flex;flex-direction:column;gap:10px}
.tg-opt{border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tg-sw{display:flex;align-items:flex-start;gap:12px;cursor:pointer;position:relative}
.tg-sw input{position:absolute;opacity:0;width:38px;height:22px;margin:0;cursor:pointer}
.tg-sw .sw{flex:none;width:38px;height:22px;border-radius:22px;background:var(--line-strong);position:relative;transition:background .2s}
.tg-sw .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:transform .2s,background .2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.tg-sw input:checked+.sw{background:var(--ink)}
.tg-sw input:checked+.sw::after{transform:translateX(16px);background:var(--neon)}
.tg-sw input:indeterminate+.sw{background:var(--neon-deep)}
.tg-sw input:indeterminate+.sw::after{transform:translateX(8px)}
.tg-sw input:focus-visible+.sw{outline:2px solid var(--ink);outline-offset:2px}
.tg-sw input:disabled{cursor:not-allowed}
.tg-sw input:disabled+.sw{opacity:.45}
.tg-sw-t{min-width:0}
.tg-sw-t b{display:block;font-size:13.5px}
.tg-pick{margin-top:10px;padding-left:50px}
.tg-pick summary{cursor:pointer;font-size:12.5px;font-weight:700;color:var(--ink)}
.tg-list{max-height:240px;overflow:auto;margin-top:8px;border-top:1px solid var(--line)}
.tg-row{display:flex;align-items:center;gap:10px;padding:7px 2px;border-bottom:1px solid var(--line);font-size:12.5px;cursor:pointer}
.tg-row .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tg-row .num{white-space:nowrap}
.tg-row input{width:16px;height:16px;accent-color:var(--ink);flex:none;margin:0}
@media (max-width:560px){.tg-pick{padding-left:0}}
@media print{
  body{background:#fff !important}
  .app,.demobar,.foot-note,#drawer,#toast,.side-scrim{display:none !important}
  #modal{position:static !important;display:block !important;padding:0 !important}
  #modal .m-back,#modal .m-head,#modal .m-actions,#modal .rc-flash{display:none !important}
  #modal .m-card{box-shadow:none !important;width:auto !important;max-height:none !important;overflow:visible !important;border-radius:0 !important}
  #modal .m-body{padding:0 !important}
  #modal .doc{border:0 !important;box-shadow:none !important}
}

/* ================= Minawa Group website style (minawagroup.pk) =================
   Stone page, white cards, ink panels, brick accent; Space Grotesk for headings and numbers, Inter for text;
   square corners and thin rule lines instead of rounded cards and shadows. Overrides the black/neon theme above.
   --neon keeps its name but is now the brick accent; brick text on ink uses --brick-light for contrast. */
:root{
  --ink:#161B1F; --ink-2:#3A4248;
  --brick:#9C4A24; --brick-dark:#6E3317; --brick-light:#E3A782;
  --neon:#9C4A24; --neon-soft:#F4E7DE; --neon-deep:#6E3317;
  --stone:#F3F0EA; --sand:#E4DED4;
  --bg:#F3F0EA; --surface:#FFFFFF; --surface-2:#F3F0EA; --line:#D9D3C9; --line-strong:#C3BBAE;
  --fg:#161B1F; --muted:#565B5F;
  --accent:#9C4A24; --accent-dark:#6E3317; --accent-darkest:#6E3317; --accent-bright:#E3A782; --accent-ink:#FFFFFF; --accent-soft:#F4E7DE;
  --good:#2F6B3F; --good-soft:#E2EDE4; --warn:#8A5A0B; --warn-soft:#F6EBD5; --bad:#B3261E; --bad-soft:#FBE4E1; --info:#3A4248; --info-soft:#E4DED4;
  --hero-from:#161B1F; --hero-mid:#161B1F; --hero-to:#161B1F;
  --shadow:0 0 0 1px #D9D3C9; --shadow-float:0 0 0 1px #D9D3C9; --shadow-nav:0 12px 32px rgba(22,27,31,.18);
  --f-head:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-num:"Space Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r-sm:0px; --r-md:0px; --r-lg:0px; --r-xl:0px;
}
body{background:var(--stone);color:#3A4045}
/* square corners everywhere, like the site; only true circles stay round */
*,*::before,*::after{border-radius:0 !important}
.av,.wa-mini,.wa-to .wa-logo,.hchip .live,.tg-sw .sw,.tg-sw .sw::after,.doc .rs-ic,.pill::before,.dot-n{border-radius:50% !important}
.tg-sw .sw{border-radius:22px !important}
.chart rect,.mb span{rx:0;ry:0}
::selection{background:var(--brick);color:#fff}
a{text-decoration-color:var(--brick)}
.search:focus,input:focus,select:focus,textarea:focus{border-color:var(--ink);box-shadow:0 0 0 3px rgba(156,74,36,.22)}
.toast{background:var(--ink);color:var(--stone);border:1px solid rgba(227,167,130,.45)}

/* type: Space Grotesk headings and figures */
h1,h2,h3,h4,.card h3,.prof-head h2,.m-head h3,.d-head h3,.page-head h2,.rules-card>summary,.allclear .big,.sb1,.tg-h4{font-family:var(--f-head);letter-spacing:-.01em}
.stat-v,.tg-v,.hs .v,.ht .v,.mt .v,.tt .v,.tg-nums b,.bal .v,.prof-head h2{font-family:var(--f-head);font-weight:700;letter-spacing:-.02em}
.crumbs h1{font-family:var(--f-head);font-size:13px;font-weight:600;letter-spacing:.16em;color:var(--brick)}

/* sidebar: an ink band, brick for the current section */
.side{background:var(--ink)}
.side :focus-visible{outline-color:var(--brick-light)}
.side-logo{background:var(--stone)}
.sb2,.side-foot{color:rgba(243,240,234,.5)}
.side-h{color:rgba(243,240,234,.42);font-family:var(--f-head);letter-spacing:.16em}
.side-i{color:rgba(243,240,234,.75)}
.side-i:hover{background:rgba(243,240,234,.07);color:var(--stone)}
.side-i[aria-current="page"]{background:var(--brick);color:#fff;font-weight:600}
.side-b{background:var(--brick-light);color:var(--ink)}
.side-i[aria-current="page"] .side-b{background:var(--ink);color:var(--brick-light)}

/* top bar: stone, a thin rule under it */
.top{background:rgba(243,240,234,.94);border-bottom-color:var(--line)}
.gsearch{background:#fff;border-color:var(--line)}
.icon-btn,.me{background:#fff;border-color:var(--line)}
.dot-n{background:var(--brick);color:#fff;border-color:var(--stone)}
.me-av,.av{background:var(--ink);color:var(--brick-light)}

/* buttons: brick main, white secondary, ink and outlined on dark */
.btn{background:#fff;border-color:var(--line-strong);color:var(--ink);font-weight:600}
.btn:hover{border-color:var(--ink);color:var(--ink)}
.btn.primary{background:var(--brick);border-color:var(--brick);color:#fff}
.btn.primary:hover{background:var(--brick-dark);border-color:var(--brick-dark);color:#fff}
.btn.neon{background:var(--brick);border-color:var(--brick);color:#fff}
.btn.neon:hover{background:var(--brick-dark);border-color:var(--brick-dark);color:#fff}
.chipbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--stone)}
.chipbtn[aria-pressed="true"] .n{color:var(--brick-light)}
.ptabs button[aria-current="true"]{border-bottom-color:var(--brick)}
.stat-go:hover{background:var(--ink);border-color:var(--ink);color:var(--brick-light)}

/* cards: white on stone, a hairline rule, no shadow */
.card,.stat{background:#fff;box-shadow:none;border:1px solid var(--line)}
.stat-ic{background:var(--ink);color:var(--brick-light)}
.chip-t.up{background:var(--good-soft);color:var(--good)}
.prog span.neon,.tg-bar span{background:var(--brick)}
.ht,.mt,.tg-nums div{background:var(--stone)}
.tt{border-color:var(--line);background:#fff}
.tt .s{color:var(--brick)}
.sp-ok{background:var(--good-soft);color:var(--good)}
.rcpt{background:var(--neon-soft);color:var(--brick-dark)}
.rcpt:hover{background:var(--brick);color:#fff}
.tg-sw input:checked+.sw{background:var(--brick)}
.tg-sw input:checked+.sw::after{background:#fff}
.tg-sw input:indeterminate+.sw{background:var(--brick-light)}

/* welcome banner: a flat ink panel like the site's hero */
.hero{background:var(--ink);box-shadow:none;border:0}
.hero h2{font-family:var(--f-head);font-weight:700;letter-spacing:-.03em;color:var(--stone)}
.hero h2 span{color:var(--brick-light)}
.hero p{color:#C9CDD0}
.hero p b{color:var(--stone)}
.hchip{background:transparent;border-color:rgba(243,240,234,.2);color:var(--stone);font-family:var(--f-head);letter-spacing:.06em}
.hchip .live{background:var(--brick-light);box-shadow:0 0 0 3px rgba(227,167,130,.25)}
.hs{border-right-color:rgba(243,240,234,.14)}
.hs .l{color:#B7BCC0;font-family:var(--f-head);letter-spacing:.14em}
.hs .v{color:var(--stone)}
.hs .v.neon{color:var(--brick-light)}
.hero .btn.ghost-d{background:transparent;border-color:#5A6268;color:var(--stone)}
.hero .btn.ghost-d:hover{border-color:var(--stone);color:var(--stone)}
.hero-date{color:#B7BCC0}

/* demo bar: ink, brick for the main action */
.demobar{background:var(--ink);border-color:rgba(243,240,234,.14)}
.db-tag{color:var(--brick-light)}
.db-btn{border-color:rgba(243,240,234,.22);color:var(--stone)}
.db-btn.primary{background:var(--brick);border-color:var(--brick);color:#fff}
.db-btn.primary:hover{background:var(--brick-dark);border-color:var(--brick-dark)}
.db-sp{color:var(--brick-light);border-color:rgba(227,167,130,.45)}
.db-date small{color:var(--brick-light)}
.seg button[aria-pressed="true"]{background:var(--brick);color:#fff}

/* PDF documents: ink rules, brick accents, green for money received */
.doc{border-color:var(--line)}
.doc .dh{border-bottom-color:var(--ink)}
.doc .dh .sub{color:#565B5F}
.doc .tot td{border-top-color:var(--ink)}
.doc .stamp{border-color:var(--ink);color:var(--ink);background:var(--stone)}
.doc .rstamp{border-color:var(--ink);background:var(--stone)}
.doc .rstamp.sp{background:#E2EDE4;border-color:#2F6B3F}
.doc .rs-ic{background:#2F6B3F;color:#fff}
.doc .rs-t b,.doc .rs-amt{color:var(--ink);font-family:var(--f-head)}

/* sidebar: Maintenance opens to the projects */
.side-i.grp .chev{margin-left:auto;display:grid;opacity:.7;transition:transform .2s}
.side-i.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.side-i.grp.in{color:var(--stone)}
.side-sub{display:flex;flex-direction:column;gap:2px;margin:2px 0 6px 21px;padding-left:10px;border-left:1px solid rgba(243,240,234,.14)}
.side-sub[hidden]{display:none}
.side-p{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:rgba(243,240,234,.8);padding:7px 10px;text-align:left;font-size:13px;font-weight:500;line-height:1.25}
.side-p small{display:block;font-size:11px;font-weight:400;color:rgba(243,240,234,.45);margin-top:1px}
.side-p:hover{background:rgba(243,240,234,.07);color:var(--stone)}
.side-p[aria-current="page"]{background:var(--brick);color:#fff;font-weight:600}
.side-p[aria-current="page"] small{color:rgba(255,255,255,.75)}
.side-p.off{color:rgba(243,240,234,.42)}
.side-p .side-b{flex:none}
@media (prefers-reduced-motion:reduce){.side-i.grp .chev{transition:none}}

/* project header, path and maintenance tabs */
.proj-head{display:flex;justify-content:space-between;align-items:flex-end;gap:8px 16px;flex-wrap:wrap}
.eyebrow-b{font-family:var(--f-head);font-size:12.5px;font-weight:600;letter-spacing:.16em;text-transform:uppercase;color:var(--brick)}
.proj-title{font-family:var(--f-head);font-size:clamp(24px,2.6vw,32px);font-weight:700;letter-spacing:-.02em;line-height:1.15;color:var(--ink);margin-top:2px}
.crumb-path a{color:var(--muted);text-decoration:none}
.crumb-path a:hover{color:var(--ink);text-decoration:underline}
.proj-tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-top:-4px}
.proj-tabs::-webkit-scrollbar{display:none}
.proj-tabs button{border:0;background:none;padding:11px 16px;margin-bottom:-1px;border-bottom:2px solid transparent;font-weight:600;font-size:14px;color:var(--muted);white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.proj-tabs button:hover{color:var(--ink)}
.proj-tabs button[aria-current="page"]{color:var(--ink);border-bottom-color:var(--brick)}
.tab-b{background:var(--brick);color:#fff;font-size:11px;font-weight:700;padding:1px 6px;min-width:18px;text-align:center;line-height:1.5}

/* company dashboard: one card per project */
.sec-row{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin:4px 0 -6px}
.sec-row .muted{font-size:12.5px}
.sec-h{font-family:var(--f-head);font-size:19px;font-weight:700;margin:0;color:var(--ink)}
.pgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:1240px){.pgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:700px){.pgrid{grid-template-columns:minmax(0,1fr)}}

const MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const METHODS = [
  ['Card','Visa or Mastercard debit and credit cards']

const BANK = 'Minawa Group – Maintenance · Sample Bank Ltd · IBAN PK00 SMPL 0000 0012 3456 7890';

const utc = s => { const a = s.split('-'); return Date.UTC(+a[0], +a[1] - 1, +a[2]); };

const addDays = (s, n) => isoOf(utc(s) + n * DAY);

const fm = p => { const a = p.split('-'); return `${MONL[+a[1] - 1]} ${a[0]}`; };
const fmShort = p => { const a = p.split('-'); return `${MON[+a[1] - 1]}-${a[0]}`; };
const dow = s => DOW[new Date(utc(s)).getUTCDay()];
const rs = n => 'Rs ' + Math.round(n).toLocaleString('en-US');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const first = n => n.split(' ')[0];
const fill = (tpl, v) => tpl.replace(/\{\{(\w+)\}\}/g, (m, k) => (v[k] != null ? v[k] : m));

let S = null;
const $ = id => document.getElementById(id);

/* ---------- state helpers ---------- */
function nid(k) { S.seq[k] = (S.seq[k] || 0) + 1; return S.seq[k]; }
function at(h) { const m = (nid('m') * 17) % 60; return `${String(h).padStart(2,'0')}:${String(m).padStart(2,'0')}`; }
function log(d, t, kind, text, ownerId) {
  S.log.push({ id: nid('log'), d, t, kind, text, ownerId: ownerId || null });
  if (S.log.length > 600) S.log.splice(0, S.log.length - 600);
}
const ownerById = id => S.owners.find(o => o.id === id);
const billsOf = o => S.bills.filter(b => b.ownerId === o.id).sort((a, b) => a.billDate < b.billDate ? -1 : 1);
const balance = o => S.entries.reduce((s, e) => e.ownerId === o.id ? s + e.amount : s, 0);
const unpaidMaint = b => b.net - b.paid;
const unpaid = b => (b.net - b.paid) + (b.fine - b.finePaid);
const promiseOn = (o, d) => !!o.promiseUntil && d <= o.promiseUntil;
const activeLink = o => S.links.find(l => l.ownerId === o.id && l.status === 'active');
const isAdmin = () => S.role === 'admin';
const roleName = () => isAdmin() ? 'Admin' : 'Accountant';

const rateTypes = () => [...new Set(S.rates.map(r => r.type))];
function rateFor(type, d) {
  let r = null;
  for (const x of S.rates) if (x.type === type && x.from <= d && (!r || x.from > r.from)) r = x;
  return r ? r.amount : 0;
}
function discountFor(o, d, amount) {
  const x = o.discount;
  if (!x || !x.value) return 0;
  if (x.until && d > x.until) return 0;
  return x.kind === 'pct' ? Math.round(amount * x.value / 100) : Math.min(x.value, amount);
}
function billingDay(o, y, m) { return Math.min(+o.possession.slice(8, 10), dim(y, m)); }
function isBillingDay(o, d) {
  if (o.status !== 'active' || o.exempt || d < o.possession) return false;
  const y = +d.slice(0, 4), m = +d.slice(5, 7), dd = +d.slice(8, 10);
  if (dd !== billingDay(o, y, m)) return false;
  return !S.bills.some(b => b.ownerId === o.id && b.period === d.slice(0, 7));
}
// Monthly target: what every billed flat owes for the month at the rate card, after agreed discounts.
// Exempt and on-hold flats aren't counted; old arrears and late fees come on top of it.
// Admins can count chosen flats back in: discounted flats at the full rate, exempt or on-hold flats at the rate card.
const tgInc = () => (S.tgInc = S.tgInc || { disc: [], exempt: [] });
function monthTarget(p) {
  const y = +p.slice(0, 4), m = +p.slice(5, 7), end = `${p}-${String(dim(y, m)).padStart(2, '0')}`, inc = tgInc();
  const t = { p, total: 0, gross: 0, flats: 0, disc: 0, discN: 0, discOn: 0, discOnN: 0, own: 0, ownN: 0, excluded: 0, exOut: 0, exOn: 0, exOnN: 0, types: [] }, byType = {};
  for (const o of S.owners) {
    if (o.status !== 'active') continue;
    const d = `${p}-${String(billingDay(o, y, m)).padStart(2, '0')}`, card = rateFor(o.type, d), amt = o.rate || card;
    if (o.exempt) {
      if (inc.exempt.includes(o.id)) { t.exOn += amt; t.exOnN++; t.total += amt; } else { t.excluded++; t.exOut += amt; }
      continue;
    }
    if (o.possession > end) continue;
    const disc = discountFor(o, d, amt);
    const ty = byType[o.type] || (byType[o.type] = { type: o.type, n: 0, rate: card, sub: 0 });
    ty.n++; ty.sub += card; t.gross += card; t.flats++;
    if (o.rate && o.rate !== card) { t.own += o.rate - card; t.ownN++; }
    const fullRate = disc && inc.disc.includes(o.id);
    if (disc && fullRate) { t.discOn += disc; t.discOnN++; } else if (disc) { t.disc += disc; t.discN++; }
    t.total += amt - (fullRate ? 0 : disc);

}
// This month's discounted flats and exempt or on-hold flats, for the target switches.
function tgLists() {
  const p = S.today.slice(0, 7), y = +p.slice(0, 4), m = +p.slice(5, 7), disc = [], exempt = [];
  for (const o of S.owners) {
    if (o.status !== 'active') continue;
    const d = `${p}-${String(billingDay(o, y, m)).padStart(2, '0')}`, amt = o.rate || rateFor(o.type, d);
    if (o.exempt) exempt.push({ o, amt });
    else { const x = discountFor(o, d, amt); if (x) disc.push({ o, disc: x }); }

// One line saying what this target counts.
function tgDesc(t, monName) {
  const parts = [`What ${t.flats + (t.exOnN || 0)} flats owe for ${monName} at the rate card`];

  else if (t.disc) parts.push('after agreed discounts');
  else if (t.discOnN) parts.push('with discounted flats at the full rate');

// The two switches, each with a list to pick flats one by one. Admins only.
function targetOptsHtml(where) {

    ${isAdmin() ? '<div class="cell-sub">Changes update this month\'s target now and are kept for the next months. Earlier months stay as they were set.</div>' : '<div class="cell-sub">Only admins (the CEO and directors) can change these.</div>'}

// After a switch changes: recalculate this month, log it, redraw, and keep open lists and focus where they were.

const markMixed = () => document.querySelectorAll('input[data-mixed]').forEach(i => { i.indeterminate = true; });
// The target is set on the 1st and kept for the month, so it doesn't move while the month runs.
function setTarget(p, d) {

function addEntry(ownerId, d, kind, amount, desc, extra) {

/* ---------- engine ---------- */
function createBill(o, d) {
  const before = balance(o);
  const amount = o.rate || rateFor(o.type, d);  // o.rate: a flat charged off the standard rate on the accountant's sheet
  const disc = discountFor(o, d, amount);
  const b = { id: 'BL-' + (2600 + nid('bill')), ownerId: o.id, period: d.slice(0, 7), billDate: d, dueDate: addDays(d, 14), finalDate: addDays(d, 28),

    const x = Math.min(o.credit, b.net);
    b.paid += x; b.fromCredit = x; o.credit -= x;
    log(d, '10:00', 'payment', `${rs(x)} of the ${fm(b.period)} bill for ${o.apt} taken from advance credit`, o.id);
  }
  log(d, '10:00', 'bill', `Bill ${b.id} created for ${o.apt}: ${rs(b.net)} (${fm(b.period)}), due ${fd(b.dueDate)}`, o.id);

const duesOf = o => (o.openingLeft || 0) + billsOf(o).reduce((s, b) => s + Math.max(0, b.net - b.paid), 0);

const isLate = (o, d) => o.openingLeft > 0 || billsOf(o).some(b => unpaidMaint(b) > 0 && d >= b.dueDate);
// While an owner is late, the late fee is 10% of everything they owe. It only ever grows here;
// payments shrink it in proportion (see allocate), so it stays 10% of what is still owed.
function syncFee(o, d) {
  if (!isLate(o, d)) return 0;
  const dues = duesOf(o), target = Math.round(dues * 0.10), add = target - (o.feeDue || 0);
  if (add <= 0) return 0;
  o.feeDue = (o.feeDue || 0) + add;
  addEntry(o.id, d, 'fine', add, `Late fee: 10% of ${rs(dues)} dues is ${rs(target)}`);
  log(d, '10:00', 'fine', `Late fee for ${o.apt} is now ${rs(target)}: 10% of ${rs(dues)} owed`, o.id);
  return add;

// Returns what the payment paid off, for the receipt: [{kind: dues|fee|credit, label, amount}].
function allocate(o, amt) {

  const dues = duesOf(o), fee = o.feeDue || 0;
  const toFee = dues > 0 ? Math.min(fee, Math.round(amt * fee / (dues + fee))) : Math.min(fee, amt);
  o.feeDue = fee - toFee; left -= toFee; put('fee', 'Late fee (10%)', toFee);
  if (o.openingLeft > 0) { const x = Math.min(left, o.openingLeft); o.openingLeft -= x; left -= x; put('dues', `Earlier dues (before ${fm(goLive().slice(0, 7))})`, x); }

  return out;
}

function runDaily(d) {

  for (const o of S.owners) {
    if (o.status !== 'active' || o.exempt) continue;
    if (isBillingDay(o, d)) { box(o.id).bill = createBill(o, d); c.bills++; }
    for (const b of billsOf(o)) {
      if (b.dueDate === d && !b.fined && unpaidMaint(b) > 0) {

        else { flag(o, d); c.flags++; }

const unitOf = o => o.unit || `${o.project || 'cc'}:${o.apt}`;
const accountsOf = o => S.owners.filter(x => unitOf(x) === unitOf(o)).sort((a, b) => (a.status === 'active') - (b.status === 'active') || ((a.possession || '') < (b.possession || '') ? -1 : 1));

  const m = new Map();

}
// Apartment order: single-letter blocks first (1-A, 2-A … then B, C, D), then double-letter blocks (1-AA … BB, CC, DD),

    for (const b of billsOf(o)) {

  for (const o of S.owners) {

/* ---------- real PDF files, made in the browser (html2canvas + jsPDF, loaded only when needed) ---------- */
const PDF_LIBS = ['https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js', 'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js'];
let pdfLibs = null;
function loadPdfLibs() {
  if (!pdfLibs) pdfLibs = Promise.all(PDF_LIBS.map(src => new Promise((ok, fail) => {
    const s = document.createElement('script'); s.src = src; s.onload = ok; s.onerror = () => fail(new Error('the PDF maker could not load')); document.head.appendChild(s);
  }))).catch(e => { pdfLibs = null; throw e; });
  return pdfLibs;
}
// Draws one of the document previews (bill, statement, receipt) onto A4 pages.
async function docToPdf(html) {
  await loadPdfLibs();
  const box = document.createElement('div');
  box.style.cssText = 'position:absolute;left:-10000px;top:0;width:720px;background:#fff';
  box.innerHTML = html; document.body.appendChild(box);
  Object.assign(box.firstElementChild.style, { boxShadow: 'none', border: '0', borderRadius: '0' });  // html2canvas would paint the card shadow over the page
  try {
    await Promise.all([...box.querySelectorAll('img')].map(i => i.complete ? 0 : new Promise(r => { i.onload = i.onerror = r; })));
    const canvas = await window.html2canvas(box.firstElementChild, { scale: 2, backgroundColor: '#ffffff', logging: false });
    const pdf = new window.jspdf.jsPDF({ unit: 'pt', format: 'a4' });
    const pw = pdf.internal.pageSize.getWidth(), ph = pdf.internal.pageSize.getHeight(), mg = 36, w = pw - 2 * mg, perPage = (ph - 2 * mg) * canvas.width / w;
    for (let y = 0, first = true; y < canvas.height; y += perPage, first = false) {
      const c = document.createElement('canvas'); c.width = canvas.width; c.height = Math.min(perPage, canvas.height - y);
      c.getContext('2d').drawImage(canvas, 0, y, c.width, c.height, 0, 0, c.width, c.height);
      if (!first) pdf.addPage();
      pdf.addImage(c.toDataURL('image/jpeg', 0.92), 'JPEG', mg, mg, w, c.height * w / c.width);
    }
    return pdf.output('blob');
  } finally { box.remove(); }
}
async function savePdf(blob, filename) {
  const dl = window.claude && typeof window.claude.use === 'function' ? await window.claude.use('downloads').catch(() => null) : null;
  if (dl) {  // the claude.ai viewer saves files through its own prompt
    try { await dl.save({ filename, data: blob }); toast(`Saved ${filename}`); }
    catch (err) { if (err && err.code !== 'declined') toast(err.code === 'rate_limited' ? 'A save prompt is already open.' : 'Saving isn\'t available here.'); }
    return;
  }
  const url = URL.createObjectURL(blob), a = document.createElement('a');
  a.href = url; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 4000);
  toast(`Downloaded ${filename}`);
}

function advance(n) {
  const tot = { bills: 0, fines: 0, notices: 0, flags: 0, alerts: 0, paused: 0 };
  for (let i = 0; i < n; i++) { S.today = addDays(S.today, 1); const c = runDaily(S.today); for (const k in c) tot[k] += c[k]; }
  const parts = [];
  if (tot.bills) parts.push(`${tot.bills} bill${tot.bills > 1 ? 's' : ''}`);
  if (tot.fines) parts.push(`${tot.fines} fine${tot.fines > 1 ? 's' : ''}`);
  if (tot.notices) parts.push(`${tot.notices} notice${tot.notices > 1 ? 's' : ''}`);
  if (tot.flags) parts.push(`${tot.flags} flagged`);
  if (tot.alerts) parts.push(`${tot.alerts} alert${tot.alerts > 1 ? 's' : ''}`);
  toast(`${fd(S.today)}: ${parts.length ? parts.join(', ') : 'daily run, nothing due'}`);
  renderAll();
}

      const n = { id: 'O' + nid('o'), project: o.project, unit: unitOf(o), apt: o.apt, block: o.block, type: o.type, name, phone, email: name.toLowerCase().replace(/[^a-z]+/g, '.') + '@example.com', possession: S.today, beh: 'none', pref: null, opening: 0, openingLeft: 0, credit: 0, exempt: false, director: false, discount: null, abroad: false, invalidPhone: false, status: 'active', flagged: false, flaggedOn: null, promiseUntil: null, notes: [], suspensions: [], prevOwnerId: o.id };
      S.owners.push(n);
      log(S.today, t, 'admin', `${o.apt} transferred: ${o.name}'s account closed (clearance ${c.no}); new account for ${name}, billed on the ${ord(+S.today.slice(8))}`, n.id);
      if (isBillingDay(n, S.today)) { const b = createBill(n, S.today); sendBill(n, b, S.today); }
      S.selected = n.id; closeModal(); toast('Transfer done. First bill sent to the buyer.'); break;
    }
    case 'disconnect': { const s = fdat.get('service'); o.suspensions.push({ service: s, from: S.today, to: null, by: roleName() }); log(S.today, t, 'flag', `${s} disconnection recorded for ${o.apt}`, o.id); closeModal(); toast('Disconnection recorded'); break; }
    case 'fix': { const fo = ownerById(f.dataset.id); fo.phone = String(fdat.get('phone')).trim(); fo.invalidPhone = false; fo.noPhone = false;
      fo.notes.push({ d: S.today, by: roleName(), text: `WhatsApp number corrected to ${fo.phone}.` });
      log(S.today, t, 'admin', `Number fixed for ${fo.apt}; latest message resent`, fo.id);
      const bal = balance(fo);
      if (bal > 0) { const l = createLink(fo, S.today, t, bal, 'resent after number fix'); pushMsg(fo, S.today, t, { kind: 'notice', title: 'Balance reminder', text: `Hi ${first(fo.name)}, this is Minawa Group. Your balance for Apt ${fo.apt} is ${rs(bal)}. Tap Pay Now to pay.`, linkId: l.id }); }
      closeModal(); toast('Number saved and message resent'); break; }
    case 'fees': { if (!needAdmin()) return; rateTypes().forEach(ty => { const v = Math.round(+fdat.get(ty)); const r = S.rates.find(x => x.type === ty && x.from === '2027-01-01'); if (r && v > 0) r.amount = v; });
      log(S.today, t, 'admin', `Rates from 1 Jan 2027 saved by ${roleName()}: ${S.rates.filter(r => r.from === '2027-01-01').map(r => r.type + ' ' + rs(r.amount)).join(', ')}`); toast('Rates saved. Use a mass announcement to tell owners.'); break; }
    case 'sendlink': { const so = ownerById(fdat.get('o')); if (so) liveWaModal(so); return; }
    case 'watest': { const n = String(fdat.get('n') || '').trim();
      if (n && waDigits(n).length < 10) { toast('That doesn\'t look like a full WhatsApp number. Include the country code, e.g. +92.'); return; }
      try { if (n) localStorage.setItem('minawa-wa-test', n); else localStorage.removeItem('minawa-wa-test'); } catch (_) {}
      toast(n ? `Live WhatsApp test messages go to ${n}` : 'Test number cleared'); break; }
    case 'announce': { if (!needAdmin()) return; const aud = fdat.get('aud'), text = String(fdat.get('text')).trim(); if (!text) return;
      const list = S.owners.filter(x => x.status === 'active' && (aud === 'all' || x.block === aud)); let failed = 0;
      list.forEach(x => { const m = pushMsg(x, S.today, t, { kind: 'announcement', title: 'Announcement', text }); if (m.status === 'failed') failed++; });
      log(S.today, t, 'message', `Announcement sent to ${list.length} owners (${aud === 'all' ? 'all blocks' : 'Block ' + aud})${failed ? `, ${failed} failed` : ''} by ${roleName()}`);
      toast(`Sent to ${list.length} owners${failed ? `, ${failed} failed` : ''}`); break; }
  }
  renderAll();
});
document.addEventListener('input', e => {
  if (e.target.id === 'search') { S.search = e.target.value; inProject(() => { $('ownersTable').innerHTML = ownersTable(); }); }
  if (e.target.id === 'paySearch') { S.paySearch = e.target.value; inProject(() => { $('payTable').innerHTML = payTable(); }); }
  if (e.target.id === 'gsearch' && S.view === 'owners') { S.search = e.target.value; inProject(() => { $('ownersTable').innerHTML = ownersTable(); }); const s = $('search'); if (s) s.value = S.search; }
});
document.addEventListener('change', e => {
  const id = e.target.id;
  if (e.target.dataset.tg) { inProject(() => onTargetOption(e.target)); return; }
  if (id === 'la-o') { S.liveAuto = e.target.value || null; const lo = ownerById(S.liveAuto); save();
    toast(lo ? `${lo.apt} · ${lo.name}: the system's messages now also go out live to the test number` : 'Live sending of the system\'s messages is off'); return; }
  if (id === 'payFam') { S.payFam = e.target.value; inProject(() => { $('payTable').innerHTML = payTable(); }); save(); }
  if (id === 'logFilter') { S.logFilter = e.target.value; renderLog(); }
  if (e.target.name === 'method' && $('coHint')) { const l = S.links.find(x => x.id === e.target.form.dataset.id); $('coHint').innerHTML = hintFor(e.target.value, ownerById(l.ownerId)); }
});
document.addEventListener('keydown', e => {
  if (e.key === 'Enter' && e.target.id === 'gsearch') { S.search = e.target.value; S.filter = 'all'; S.view = 'owners'; renderAll(); window.scrollTo(0, 0); const g = $('gsearch'); if (g) { g.focus(); g.setSelectionRange(g.value.length, g.value.length); } return; }
  if (e.key === 'Escape') { if (!$('modal').hidden) closeModal(); else if (!$('drawer').hidden) { $('drawer').hidden = true; $('drawer').innerHTML = ''; } }
});

/* ---------- persistence ---------- */
function save() { try { localStorage.setItem(MODE === 'real' ? KEY_REAL : KEY, JSON.stringify(fullS())); } catch (_) {} }
function readState(key) {
  try { const raw = localStorage.getItem(key); if (raw) { const st = JSON.parse(raw); if (st && st.v === 8 && st.owners && st.owners.length) return st; } } catch (_) {}
  return null;
}
function load() {
  let m = 'sample'; try { m = localStorage.getItem(MODE_KEY) || 'sample'; } catch (_) {}
  const real = m === 'real' && location.hostname.match(/^(localhost|127\.0\.0\.1)$/) ? readState(KEY_REAL) : null;
  if (real) { MODE = 'real'; S = real; }
  else { MODE = 'sample'; S = readState(KEY); if (!S) seed(); }
  if (!S.templates.reminder) S.templates.reminder = reminderTpl();  // saved before the payment-link template existed
}
// Real owner records are served only by the local server (scripts/serve_demo.py), never by the published page.
async function realDetect() {
  if (!/^(localhost|127\.0\.0\.1)$/.test(location.hostname)) return;
  try { const r = await fetch('api/real/owners', { cache: 'no-store' }); if (r.ok) { REAL.data = await r.json(); REAL.available = true; } }
  catch (_) { /* no local server */ }
  if (MODE === 'real' && REAL.data && REAL.data.meta.importedAt !== S.importedAt) { seedReal(REAL.data); renderAll(); toast(`Loaded the newer import of ${REAL.data.meta.source}`); return; }
  renderTop();
}
async function switchMode(m) {
  if (m === MODE) return;
  if (m === 'real' && !REAL.data) await realDetect();
  if (m === 'real' && !REAL.data) { toast('Real data needs the local server and the import. Run scripts/import_maintenance_xls.py first.'); return; }
  save(); clearInterval(SP.timer);
  MODE = m; try { localStorage.setItem(MODE_KEY, m); } catch (_) {}
  if (m === 'real') { S = readState(KEY_REAL); if (!S || S.importedAt !== REAL.data.meta.importedAt) seedReal(REAL.data); }  // a newer import replaces old real-data state
  else { S = readState(KEY); if (!S) seed(); }
  S.view = 'home'; closeModal(); $('drawer').hidden = true;
  renderAll(); window.scrollTo(0, 0);
  toast(m === 'real' ? `Real data: ${S.owners.length} apartments from ${S.source}. Only on this computer.` : 'Back to the sample data');
}
load();
renderAll();
spDetect();
realDetect();
configDetect();
window.minawaDemoState = () => S;
})();
</script>
